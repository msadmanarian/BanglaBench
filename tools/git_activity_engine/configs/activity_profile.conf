# =====================================================================
# BanglaBench Git Activity & Contribution Engine Configuration
# =====================================================================

# Time Horizon Settings
DAYS_BACK=90                      # How many days back into the past to populate
START_DATE=""                     # Optional: Explicit YYYY-MM-DD (overrides DAYS_BACK if set)
END_DATE=""                       # Optional: Explicit YYYY-MM-DD (defaults to today)

# Intensity & Distribution
MIN_COMMITS_PER_DAY=1             # Minimum commits on an active day
MAX_COMMITS_PER_DAY=4             # Maximum commits on an active day
WEEKEND_ACTIVITY_PROB=40          # Percentage probability of committing on Sat/Sun (0-100)
WEEKDAY_ACTIVITY_PROB=85          # Percentage probability of committing on Mon-Fri (0-100)

# Activity Target
TARGET_BRANCH="main"              # Branch to record activity on
ACTIVITY_FILE="docs/RESEARCH_ACTIVITY_LOG.md"  # Journal file updated per commit
AUTHOR_NAME="msadmanarian"
AUTHOR_EMAIL="msadmanarian@gmail.com"
